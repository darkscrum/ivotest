    { g:'exit', k:'<code>OriginalCallSid</code>', pv:'—', gve:'<code>{{trigger.call.SipHeader_X-GliaInternal-Original-Call-Sid}}</code>' },
    { g:'exit', k:'Exit to an external number', pv:'<code>connect_caller_to</code>', gve:'<code>POST …/studio_ivr_call_to_external_number</code> (OriginalCallSid, Called, AccountSid)' },
    { g:'exit', k:'Extension digits', pv:'TwiML Redirect → TwiML Bin with <code>sendDigits</code>', gve:'Same endpoint, plus <code>Extension</code>' },
    { g:'exit', k:'Fallback if the exit fails', pv:'<code>connect_caller_to</code> the Glia queue number over PSTN', gve:'Not needed. If Glia is down the call never reached the IVR.' },
    { g:'exit', k:'<code>send_exit_event</code>', pv:'Before every exit', gve:'Same', same:true },
    { g:'same', k:'Functions, service, env vars', pv:'acquire-token, holiday / business hours, check-queue-status, pull-asset', gve:'Unchanged', same:true },
    { g:'same', k:'Hub resources, IVR API user, Template, gather / splits / prompts', pv:'As before', gve:'Unchanged', same:true },
    { g:'dont', k:'Do not use on GVE', pv:'', gve:'<ul class="neg"><li>Connect Call To widgets, also as a fallback</li><li>TwiML Redirect widgets and TwiML Bins for transfers</li><li>The Update Call widget (<code>studio_call_accepted</code>)</li><li>The old <code>studio_ivr_requests</code> endpoint and the CallSid / CallToken parameters</li><li>Buying a number in the Twilio console and pointing “A call comes in” at the flow</li></ul>' }
  ],
  dont:[
    { id:'connect', w:'Connect Call To · TwiML Redirect / TwiML Bins', pv:'Dialled an external number and bridged the caller’s call to it; the Bin added <code>sendDigits</code> for an extension. Also used as the PSTN fallback.', why:'Runs on leg B. Twilio bridges Glia’s side call, not the caller. GVE is never told the IVR ended, and the caller on leg A is left hanging.', use:'<code>studio_ivr_call_to_external_number</code> (+ <code>Extension</code>)' },
    { id:'update', w:'Update Call (<code>studio_call_accepted</code>)', pv:'Made Twilio redirect the caller’s call into Glia after <code>call_glia</code>.', why:'Nothing to redirect: Glia already holds the caller. Glia ends leg B itself after the exit request.', use:'Nothing after the exit request' },
    { id:'oldexit', w:'<code>call_glia</code> → <code>studio_ivr_requests</code> with CallSid / CallToken', pv:'Told Glia which Twilio call to expect and gave it the token to take it over.', why:'CallSid is leg B’s SID, unknown to Glia as a caller. CallToken is a PV-only redirect token. Glia needs the caller’s own ID from the SIP header.', use:'<code>studio_ivr_call_to_queue</code> with <code>OriginalCallSid</code>' },
    { id:'console', w:'Buying a number in the Twilio console, “A call comes in” → flow', pv:'The way every IVR number was connected.', why:'Creates a PV IVR outside Glia: not in Hub, refused by attach, not migrated by anyone, old exits required.', use:'Number in Glia Hub + attach' }
  ],
  gaps:[
    { id:'block', t:'Caller blocking', s:'stop specific numbers from reaching operators',
      pv:'<div class="chain"><span class="cb">Call comes in</span><span class="ar">→</span><span class="cb">Twilio Function checks the blocklist</span><span class="ar">→</span><span class="cb">IVR or queue</span></div><p>A Function sat in front of the IVR on the number itself and dropped blocked callers before passing the call on.</p>',
      gve:'<div class="chain"><span class="cb">Leg B from GVE</span><span class="ar">→</span><span class="cb x">Function in front</span><span class="ar">→</span><span class="cb new">Blocklist widget inside the flow</span></div><p>The SIP Domain triggers the flow directly, so nothing can sit in front of it. The blocklist is a JSON file checked by the flow; blocked callers are dropped, everyone else continues. Guide: “Blocking inbound calls based on caller number in Twilio Studio IVR flows”.</p>' },
    { id:'stir', t:'STIR/SHAKEN attestation', s:'showing the caller’s attestation level to operators',
      pv:'<div class="chain"><span class="cb">Caller’s call carries the attestation</span><span class="ar">→</span><span class="cb">Flow reads it</span><span class="ar">→</span><span class="cb">Sent to Glia as a visitor custom attribute</span></div><p>The flow ran on the caller’s own call, so Twilio’s attestation value was right there for the flow to pass along.</p>',
      gve:'<div class="chain"><span class="cb">Leg B is a SIP call from Glia</span><span class="ar">→</span><span class="cb x">Flow reads it</span><span class="ar">→</span><span class="cb new">Glia adds the attribute natively</span></div><p>The flow never sees the caller’s call, so it cannot read the attestation. Instead Glia adds the custom attribute itself when the rollout toggle is on (MED-1980). Remove the capture step from the flow; it does nothing on GVE.</p>' }
  ],
  steps:[
    { t:'Most of the flow stays the same', rows:[],
      b:'<p>Same sub-account, same Studio limits, same IVR Template, same functions, same Hub resources. What the caller hears and does is unchanged. The differences are the number, the name, and the exits.</p>',
      n:'Reassure: an IE who has built PV IVRs can build GVE IVRs. Two things to unlearn, one thing to learn.' },
    { t:'The number', rows:['number'],
      b:'<p>The number is in Glia Hub and must work as a regular number before it becomes an IVR number. The trigger is the IVR flag plus the SIP Domain, created by attach.</p>' },
    { t:'The name and the variables', rows:['build'],
      b:'<p><code>[GVE]</code> in the flow name is what attach checks and what the migration uses to tell migrated flows apart. <code>flow_url</code> is set up as before: Trigger widget → Webhook URL.</p>' },
    { t:'The exits', rows:['exit'],
      b:'<p>Every exit becomes one Make HTTP Request with <code>OriginalCallSid</code>, <code>Called</code> and <code>AccountSid</code>, with <code>send_exit_event</code> in front of it. Glia ends the IVR leg itself, so nothing follows the request.</p>',
      n:'OriginalCallSid comes from the SIP header on leg B. Without it Glia cannot find leg A.' },
    { t:'Unchanged building blocks', rows:['same'],
      b:'<p>Enter event, <code>acquireToken</code>, emergency, holiday and business-hours checks, queue status checks, pulling and playing assets, gather input and splits all work as before.</p>' },
    { t:'Do not use on GVE', view:'dont',
      b:'<p>One reason behind all of them: on GVE the flow runs on leg B, Glia’s side call to the IVR. Widgets that act on “the call” act on leg B, while the caller sits on leg A, which only Glia can route.</p>' },
    { t:'Connect Call To and TwiML Redirect', view:'dont', item:'connect',
      b:'<p>Twilio would dial the external number and bridge it to leg B. The caller on leg A hears nothing of it, GVE never learns the IVR has ended, and when leg B drops the caller is stranded.</p>',
      d:[['Use instead','<code>studio_ivr_call_to_external_number</code>, plus <code>Extension</code> instead of a TwiML Bin with <code>sendDigits</code>. Glia ends leg B and dials from leg A.']] },
    { t:'Update Call', view:'dont', item:'update',
      b:'<p>On PV it told Twilio to redirect the caller’s call into Glia. On GVE Glia already holds the caller; there is nothing to redirect. Glia ends leg B itself once the exit request arrives.</p>',
      d:[['Use instead','Nothing. The exit request is the last widget on the path.']] },
    { t:'The old call_glia with CallSid and CallToken', view:'dont', item:'oldexit',
      b:'<p><code>CallSid</code> on GVE is leg B’s Twilio SID, which Glia cannot match to any caller, and <code>CallToken</code> only exists for PV redirects. Glia needs the caller’s own call ID, which it put in the SIP header when it opened leg B.</p>',
      d:[['Use instead','<code>studio_ivr_call_to_queue</code> with <code>OriginalCallSid = {{trigger.call.SipHeader_X-GliaInternal-Original-Call-Sid}}</code>, <code>Called</code> and <code>AccountSid</code>.']] },
    { t:'A number pointed at the flow in the Twilio console', view:'dont', item:'console',
      b:'<p>It works, but as a PV IVR outside Glia: the number is invisible in Hub, attach refuses it, nobody will migrate it, and the exits have to be the old ones. You have built the thing we are moving away from.</p>',
      d:[['Use instead','Number in Glia Hub, then attach. That is the only way a number becomes an IVR number on GVE.']] },
    { t:'Known gap: caller blocking', view:'gaps', gap:'block',
      b:'<p>On PV a Function on the number blocked callers before the IVR. On GVE nothing can sit in front of the flow, so the blocklist moves inside it.</p>' },
    { t:'Known gap: STIR/SHAKEN', view:'gaps', gap:'stir',
      b:'<p>On PV the flow read the attestation from the caller’s call and passed it to Glia as a custom attribute. On GVE the flow only sees Glia’s side call, so Glia adds the attribute natively behind a rollout toggle.</p>' }
  ]
}
];

/* ---------- state ---------- */
let ci = 0, si = 0, timer = null, showNotes = false;
const $ = id => document.getElementById(id);
const mapEl = $('map'), capEl = $('cap'), dotsEl = $('dots'), countEl = $('count'), liveEl = $('live');
let nodeEls = {}, edgeEls = {}, rowEls = {}, gapEls = {}, dontEls = {}, view = '';

/* ---------- chapter nav ---------- */
const nav = $('chapters');
CH.forEach((c, i) => {
  const b = document.createElement('button');
  b.innerHTML = `<b>${c.num}</b>${c.name}`;
  b.addEventListener('click', () => go(i, 0, true));
  nav.appendChild(b);
});

/* ---------- builders ---------- */
function svgEl(tag, attrs) { const el = document.createElementNS(NS, tag); for (const k in attrs) el.setAttribute(k, attrs[k]); return el; }
function text(x, y, cls, str, anchor) { const t = svgEl('text', { x, y, class: cls }); if (anchor) t.setAttribute('text-anchor', anchor); t.textContent = str; return t; }

function buildMap(ch) {
  const L = LAYOUTS[ch.layout];
  mapEl.innerHTML = '';
  const scroll = document.createElement('div'); scroll.className = 'svgscroll';
  const svg = svgEl('svg', { class: 'topo', viewBox: `0 0 ${VBW} ${VBH}`, role: 'img', 'aria-label': ch.title });
  const defs = svgEl('defs', {});
  ['sip','http','audio','ctrl','neg','warn'].forEach(k => {
    const m = svgEl('marker', { id: 'arr-' + k, viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 6, markerHeight: 6, orient: 'auto-start-reverse' });
    const p = svgEl('path', { d: 'M0,0 L10,5 L0,10 z' });
    p.style.fill = `var(--${k})`;
    m.appendChild(p); defs.appendChild(m);
  });
  svg.appendChild(defs);
  L.zones.forEach(z => {
    const g = svgEl('g', { class: 'zone' });
    g.appendChild(svgEl('rect', { x: z.x, y: z.y, width: z.w, height: z.h, rx: 8 }));
    g.appendChild(text(z.x + 12, z.y + 20, '', z.label));
    svg.appendChild(g);
  });
  edgeEls = {};
  const eg = svgEl('g', { class: 'edges' });
  for (const id in ch.edges) {
    const e = ch.edges[id];
    const g = svgEl('g', { class: 'e ' + e.kind, 'data-id': id });
    const d = 'M' + e.pts.map(p => p.join(',')).join(' L');
    const path = svgEl('path', { d });
    if (e.kind !== 'audio') path.setAttribute('marker-end', `url(#arr-${e.kind})`);
    g.appendChild(path);
    if (e.label) {
      let lx, ly;
      let anc = null; if (e.lab) { [lx, ly, anc] = e.lab; } else { const a = e.pts[0], b = e.pts[e.pts.length - 1]; lx = (a[0] + b[0]) / 2; ly = (a[1] + b[1]) / 2 - 8; }
      g.appendChild(text(lx, ly, '', e.label, anc));
    }
    if (!reduce.matches) {
      const c = svgEl('circle', { r: 6, class: 'pulse' });
      const am = svgEl('animateMotion', { dur: '1.8s', repeatCount: 'indefinite', path: d });
      c.appendChild(am); g.appendChild(c);
    }
    eg.appendChild(g); edgeEls[id] = g;
  }
  svg.appendChild(eg);
  nodeEls = {};
  ch.nodes.forEach(id => {
    const n = NODES[id], [cx, cy] = L.pos[id];
    const g = svgEl('g', { class: 'node', 'data-id': id, tabindex: 0 });
    g.appendChild(svgEl('rect', { class: 'box', x: cx - NW / 2, y: cy - NH / 2, width: NW, height: NH, rx: 6 }));
    g.appendChild(text(cx, cy - 5, 'l', n.l, 'middle'));
    const sub = (ch.subs && ch.subs[id]) || n.s;
    g.appendChild(text(cx, cy + 16, 's', sub, 'middle'));
    const bg = svgEl('g', { class: 'badge' }); bg.style.display = 'none';
    const br = svgEl('rect', { x: cx + NW / 2 - 8, y: cy - NH / 2 - 10, height: 18, rx: 9 });
    const bt = text(0, cy - NH / 2 + 3, '', '', 'middle');
    bg.appendChild(br); bg.appendChild(bt);
    g.appendChild(bg);
    svg.appendChild(g); nodeEls[id] = g;
  });
  scroll.appendChild(svg); mapEl.appendChild(scroll);
  const leg = document.createElement('div'); leg.className = 'legend';
  leg.innerHTML = `<span><i style="--c:var(--sip)"></i>call leg (SIP / PSTN)</span><span><i style="--c:var(--http)"></i>HTTP request</span><span><i class="dash" style="--c:var(--audio)"></i>audio</span><span><i style="--c:var(--ctrl)"></i>lookup / control</span><span><i style="--c:var(--neg)"></i>refusal / removal</span>`;
  mapEl.appendChild(leg);
  view = 'map';
}

function buildTable(ch) {
  mapEl.innerHTML = '';
  const wrap = document.createElement('div'); wrap.className = 'tbl';
  const t = document.createElement('table'); t.className = 'cmp';
  t.innerHTML = '<thead><tr><th>Building block</th><th>Programmable Voice</th><th>Glia Voice Engine</th></tr></thead>';
  const tb = document.createElement('tbody');
  rowEls = {};
  ch.rows.forEach(r => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${r.k}</td><td>${r.pv}</td><td class="${r.same ? 'same' : ''}">${r.gve}</td>`;
    tb.appendChild(tr); (rowEls[r.g] = rowEls[r.g] || []).push(tr);
  });
  t.appendChild(tb); wrap.appendChild(t); mapEl.appendChild(wrap);
  view = 'table';
}

function buildDont(ch) {
  mapEl.innerHTML = '';
  const wrap = document.createElement('div'); wrap.className = 'dont';
  wrap.innerHTML = '<div class="hd"><span>Widget</span><span>What it did on PV</span><span>Why it breaks on GVE</span><span>Use instead</span></div>';
  dontEls = {};
  ch.dont.forEach(it => {
    const d = document.createElement('div'); d.className = 'it';
    d.innerHTML = `<div><b>${it.w}</b></div><div>${it.pv}</div><div>${it.why}</div><div class="use">${it.use}</div>`;
    wrap.appendChild(d); dontEls[it.id] = d;
  });
  mapEl.appendChild(wrap);
  view = 'dont';
}

function buildGaps(ch) {
  mapEl.innerHTML = '';
  const wrap = document.createElement('div'); wrap.className = 'gaps';
  gapEls = {};
  ch.gaps.forEach(g => {
    const d = document.createElement('div'); d.className = 'gap';
    d.innerHTML = `<h4>${g.t}<small>${g.s}</small></h4><div class="col"><b>Programmable Voice</b>${g.pv}</div><div class="col"><b>Glia Voice Engine</b>${g.gve}</div>`;
    wrap.appendChild(d); gapEls[g.id] = d;
  });
  mapEl.appendChild(wrap);
  view = 'gaps';
}

/* ---------- step paint ---------- */
function paint() {
  const ch = CH[ci], st = ch.steps[si];
  if (ch.kind === 'table') {
    const want = st.view || 'table';
    if (view !== want) ({ gaps: buildGaps, dont: buildDont, table: buildTable })[want](ch);
    if (want === 'gaps') { for (const id in gapEls) { gapEls[id].classList.toggle('hot', id === st.gap); gapEls[id].classList.toggle('dim', id !== st.gap); } }
    else if (want === 'dont') { for (const id in dontEls) { dontEls[id].classList.toggle('hot', id === st.item); dontEls[id].classList.toggle('dim', !!st.item && id !== st.item); } }
    else { const hot = new Set(st.rows || []); for (const g in rowEls) rowEls[g].forEach(tr => { tr.classList.toggle('hot', hot.has(g)); tr.classList.toggle('dim', hot.size > 0 && !hot.has(g)); }); }
  } else if (st.panel) {
    if (view !== 'panel' + si) { mapEl.innerHTML = st.panel; view = 'panel' + si; }
  } else {
    if (view !== 'map') buildMap(ch);
    const show = new Set(st.show || []), act = new Set(st.active || []);
    act.forEach(id => show.add(id));
    for (const id in edgeEls) { edgeEls[id].classList.toggle('show', show.has(id) && !act.has(id)); edgeEls[id].classList.toggle('active', act.has(id)); }
    const on = new Set(st.on || []), dim = new Set(st.dim || []), gone = new Set(st.gone || []), warn = new Set(st.warn || []);
    const opt = new Set(ch.optional || []), reveal = new Set(st.reveal || []);
    for (const id in nodeEls) {
      const g = nodeEls[id];
      g.classList.toggle('off', opt.has(id) && !reveal.has(id));
      g.classList.toggle('on', on.has(id)); g.classList.toggle('dim', dim.has(id)); g.classList.toggle('gone', gone.has(id)); g.classList.toggle('warn', warn.has(id));
      const b = (st.badges || {})[id];
      const bg = g.querySelector('.badge');
      if (b) {
        bg.style.display = '';
        const bt = bg.querySelector('text'), br = bg.querySelector('rect');
        bt.textContent = b.toUpperCase();
        const w = b.length * 7 + 16; const cx = +g.querySelector('.box').getAttribute('x') + NW;
        br.setAttribute('width', w); br.setAttribute('x', cx - w + 6); bt.setAttribute('x', cx - w / 2 + 6);
        bg.classList.toggle('neg', gone.has(id)); bg.classList.toggle('warn', warn.has(id));
      } else bg.style.display = 'none';
    }
  }
  /* caption */
  let h = `<p class="eyebrow">Chapter ${ch.num} · ${ch.name} · step ${si + 1} of ${ch.steps.length}</p><h2>${st.t}</h2>`;
  if (st.flag) h += `<span class="flag ${st.flag[0]}">${st.flag[1]}</span>`;
  h += `<div class="body">${st.b}</div>`;
  if (st.cfg) h += st.cfg;
  if (st.list) h += `<ul class="${st.listClass || ''}">${st.list.map(x => `<li>${x}</li>`).join('')}</ul>`;
  if (st.d) h += `<dl>${st.d.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`;
  if (st.code) h += `<pre>${code(st.code)}</pre>`;
  if (st.note) h += `<div class="note">${st.note}</div>`;
  if (showNotes && st.n) h += `<div class="notes"><b>Speaker notes</b>${st.n}</div>`;
  capEl.innerHTML = h;
  /* controls */
  countEl.textContent = `${si + 1} / ${ch.steps.length}`;
  dotsEl.innerHTML = '';
  ch.steps.forEach((s, i) => {
    const b = document.createElement('button'); b.className = i < si ? 'done' : i === si ? 'now' : ''; b.setAttribute('aria-label', `Step ${i + 1}: ${s.t}`); b.title = s.t;
    b.addEventListener('click', () => go(ci, i, true)); dotsEl.appendChild(b);
  });
  $('prev').disabled = ci === 0 && si === 0;
  $('next').disabled = ci === CH.length - 1 && si === ch.steps.length - 1;
  [...nav.children].forEach((b, i) => b.setAttribute('aria-current', i === ci ? 'true' : 'false'));
  liveEl.textContent = `${ch.name}, step ${si + 1}: ${st.t}`;
}

function go(c, s, user) {
  const changed = c !== ci || !mapEl.firstChild;
  ci = c; si = s;
  const ch = CH[ci];
  if (changed) { view = ''; if (ch.kind !== 'table') buildMap(ch); try { history.replaceState(null, '', '#' + ch.id); } catch (e) {} }
  paint();
  if (user) stopPlay();
}
function next() { const ch = CH[ci]; if (si < ch.steps.length - 1) go(ci, si + 1); else if (ci < CH.length - 1) go(ci + 1, 0); else stopPlay(); }
function prev() { if (si > 0) go(ci, si - 1); else if (ci > 0) go(ci - 1, CH[ci - 1].steps.length - 1); }

/* ---------- play ---------- */
function startPlay() { stopPlay(); timer = setInterval(next, 8000); $('play').textContent = 'Pause'; $('play').setAttribute('aria-pressed', 'true'); }
function stopPlay() { if (timer) clearInterval(timer); timer = null; $('play').textContent = 'Play'; $('play').setAttribute('aria-pressed', 'false'); }

/* ---------- wiring ---------- */
$('prev').addEventListener('click', () => { prev(); stopPlay(); });
$('next').addEventListener('click', () => { next(); stopPlay(); });
$('play').addEventListener('click', () => timer ? stopPlay() : startPlay());
$('notes').addEventListener('click', () => { showNotes = !showNotes; $('notes').setAttribute('aria-pressed', String(showNotes)); paint(); });
$('fs').addEventListener('click', () => { const d = $('deck'); if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); else if (d.requestFullscreen) d.requestFullscreen().catch(() => {}); });
document.addEventListener('keydown', ev => {
  if (ev.target && /INPUT|TEXTAREA/.test(ev.target.tagName)) return;
  const k = ev.key;
  if (k === 'ArrowRight' || k === 'PageDown' || k === ' ') { ev.preventDefault(); next(); stopPlay(); }
  else if (k === 'ArrowLeft' || k === 'PageUp') { ev.preventDefault(); prev(); stopPlay(); }
  else if (k === 'Home') { go(ci, 0, true); }
  else if (k === 'End') { go(ci, CH[ci].steps.length - 1, true); }
  else if (/^[1-5]$/.test(k)) { go(+k - 1, 0, true); }
  else if (k === 'n' || k === 'N') { $('notes').click(); }
  else if (k === 'f' || k === 'F') { $('fs').click(); }
  else if (k === 'p' || k === 'P') { $('play').click(); }
});
function fromHash() { const id = (location.hash || '').slice(1); const i = CH.findIndex(c => c.id === id); go(i >= 0 ? i : 0, 0); }
window.addEventListener('hashchange', fromHash);
fromHash();
})();
</script>
